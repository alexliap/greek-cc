[project]
name = "greek-cc"
version = "0.1.0"
description = "Greek-language manifests from Common Crawl's columnar index"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "polars>=1.43.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greek_cc"]
