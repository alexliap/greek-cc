[project]
name = "greek-cc"
version = "0.1.0"
description = "Greek-language manifests from Common Crawl's columnar index"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.34",
    "datatrove>=0.10.0",
    "fasteners>=0.20",
    "fasttext-numpy2-wheel>=0.9.2",
    "faust-cchardet>=3.2.0",
    "ftfy>=6.3.1",
    "huggingface-hub>=1.28.0",
    "nltk>=3.10.3",
    "polars>=1.43.2",
    "pyahocorasick>=2.3.1",
    "pyarrow>=25.0.1",
    "python-magic>=0.4.27",
    "spacy>=3.8.15",
    "tldextract>=5.3.2",
    "tokenizers>=0.23.1",
    "trafilatura>=2.2.0",
    "warcio>=1.8.1",
    "xxhash<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greek_cc"]

[dependency-groups]
dev = [
    "apache-airflow==3.3.1",
    "apache-airflow-providers-postgres>=7.0.1",
]
