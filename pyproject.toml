[project]
name = "greek-cc"
version = "0.1.0"
description = "Greek-language manifests from Common Crawl's columnar index"
readme = "README.md"
requires-python = ">=3.13"
# Deliberately empty: the two entry points need very different trees, and the
# Airflow image should not carry the extraction one. Pick an extra explicitly.
dependencies = []

[project.optional-dependencies]
# What greek_cc_manifest_dag.py actually reaches: index.py, db.py, crawls.py.
# Their only third-party imports are polars and huggingface_hub (psycopg2 comes
# from apache-airflow-providers-postgres, installed separately in the image).
# Keeping this separate is what lets the Airflow image skip the 1.57GB GlotLID
# model and the spacy/trafilatura/fasttext tree it never loads.
dag = [
    "huggingface-hub>=1.28.0",
    "polars>=1.43.2",
]

# The on-demand `greek-cc-extract` CLI (cli.py -> extract.py, warc_reader.py).
# Runs outside Airflow -- see README -- so nothing here belongs in the image.
extract = [
    "greek-cc[dag]",
    "boto3>=1.34",
    "datatrove>=0.10.0",
    "fasteners>=0.20",
    "fasttext-numpy2-wheel>=0.9.2",
    "faust-cchardet>=3.2.0",
    "ftfy>=6.3.1",
    "nltk>=3.10.3",
    "pyahocorasick>=2.3.1",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.0.1",
    "python-magic>=0.4.27",
    "spacy>=3.8.15",
    "tldextract>=5.3.2",
    "tokenizers>=0.23.1",
    "trafilatura>=2.2.0",
    "warcio>=1.8.1",
    "xxhash<4",
]

[project.scripts]
greek-cc-extract = "greek_cc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greek_cc"]

[dependency-groups]
dev = [
    "apache-airflow==3.3.1",
    "apache-airflow-providers-postgres>=7.0.1",
]
