x-airflow-env: &airflow-env
  # we run as the host UID (not the image's airflow user), so HOME must be set
  # explicitly or python misses /home/airflow/.local and can't import airflow
  HOME: /home/airflow
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # workers (forked by the scheduler, in its own container) call back to this
  # URL to fetch task workloads; the default is localhost:8080, which is dead
  # inside the scheduler container since api-server runs separately
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  # airflow 3 defaults to SimpleAuthManager: users come from config, and the
  # password file is seeded by airflow-init so it survives container recreation
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${_AIRFLOW_WWW_USER_USERNAME}:admin"
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
  # must be identical across services, or a task worker's token (signed by the
  # scheduler) fails verification on the api-server ("Invalid auth token")
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
  # POSTGRES_HOST defaults to the postgres service in this compose project.
  # Set it in .env (alongside COMPOSE_FILE, see docs/running-on-macos.md) to
  # point at a Postgres running on another machine instead.
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/airflow
  # LocalExecutor runs a project's CPU-bound work as a subprocess of this
  # scheduler container; on a small host that starves the scheduler's own
  # heartbeat past the 30s default, which makes it conclude it died and
  # defensively reset the still-running task as "orphaned" -- throwing away
  # that task's progress and restarting it, not because anything was wrong.
  # Raised well past the heartbeat gaps observed in practice (up to ~77s).
  AIRFLOW__SCHEDULER__SCHEDULER_HEALTH_CHECK_THRESHOLD: "300"

  # ---- project: greek-cc ----------------------------------------------------
  AIRFLOW_CONN_GREEK_CC_DB: postgresql://greek_cc_app:${GREEK_CC_DB_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/greek_cc
  # NOTE: these are injected into every Airflow service, so any project's DAG
  # can read them. Once a second project lands here, scope these to greek-cc's
  # own tasks via an Airflow Connection instead of a blanket env var.
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
  # ---- end project: greek-cc ------------------------------------------------

x-airflow-common: &airflow-common
  # only airflow-init declares `build` — sharing it across every service makes
  # compose build the same tag concurrently and the targets collide
  image: greek-cc-airflow:3.3.1
  user: "${AIRFLOW_UID}:0"
  # Docker's embedded DNS forwards to the host's systemd-resolved stub
  # (127.0.0.53), which timed out under greek-cc's concurrent S3 fetches and
  # took the whole Pi down twice -- dockerd logged hundreds of "failed to query
  # external DNS server" timeouts, made worse by systemd-resolved flushing its
  # cache under memory pressure (forcing yet more lookups). Talking to real
  # upstream resolvers skips that fragile hop.
  dns:
    - 1.1.1.1
    - 8.8.8.8
  volumes:
    # each project's DAGs mount into their own subdirectory so two projects
    # can't collide on filenames; the dag-processor scans /opt/airflow/dags
    # recursively, so this just works
    - ../greek-cc/dags:/opt/airflow/dags/greek_cc
    - ../greek-cc/manifests:/opt/airflow/manifests
    - ./airflow_logs:/opt/airflow/logs
    - ./airflow_auth:/opt/airflow/auth
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    # Behind a profile so a machine that uses someone else's Postgres simply
    # doesn't start one. Enabled via COMPOSE_PROFILES=local-db in .env, which
    # keeps `docker compose up -d` identical on every machine.
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
      GREEK_CC_DB_PASSWORD: ${GREEK_CC_DB_PASSWORD}
    # exposed so a GUI client (DBeaver) can reach it from another machine
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      # mounted as a specific file, not the directory: postgres only globs
      # direct children of docker-entrypoint-initdb.d, and this way a second
      # project can mount its own init script alongside without conflict
      - ../greek-cc/docker/postgres-init/01-create-app-db.sh:/docker-entrypoint-initdb.d/01-create-app-db-greek-cc.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    build:
      context: .
      dockerfile: docker/Dockerfile
      # each project's source stays scoped to its own directory rather than
      # being merged into one shared build context; adding a project here is
      # one more named context plus its own COPY --from block in the Dockerfile
      additional_contexts:
        greek-cc: ../greek-cc
    environment:
      <<: *airflow-env
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
    # keep the image's own entrypoint: it registers an /etc/passwd entry for our
    # host UID, without which airflow's getuser() call blows up
    command:
      - bash
      - -c
      - |
        airflow db migrate
        python -c "
        import json, os
        path = os.environ['AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE']
        json.dump({os.environ['_AIRFLOW_WWW_USER_USERNAME']: os.environ['_AIRFLOW_WWW_USER_PASSWORD']}, open(path, 'w'))
        print('seeded', path)
        "
        python -c "
        from airflow.providers.postgres.hooks.postgres import PostgresHook
        from greek_cc import db
        db.ensure_schema(PostgresHook(postgres_conn_id='greek_cc_db').get_conn())
        "
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    environment: *airflow-env
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    environment: *airflow-env
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    environment: *airflow-env
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
    # pinned to the name Compose generated back when this deployment lived in
    # the greek-cc directory. Compose derives volume names from the project
    # name (the directory basename), so without this it would look for
    # "airflow_postgres-db-volume", not find it, and silently start from an
    # empty database -- losing every crawl/extract status row and all DAG
    # history. Do not rename.
    name: greek-cc_postgres-db-volume
