x-airflow-env: &airflow-env
  # we run as the host UID (not the image's airflow user), so HOME must be set
  # explicitly or python misses /home/airflow/.local and can't import airflow
  HOME: /home/airflow
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # workers (forked by the scheduler, in its own container) call back to this
  # URL to fetch task workloads; the default is localhost:8080, which is dead
  # inside the scheduler container since api-server runs separately
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  # airflow 3 defaults to SimpleAuthManager: users come from config, and the
  # password file is seeded by airflow-init so it survives container recreation
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${_AIRFLOW_WWW_USER_USERNAME}:admin"
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
  # must be identical across services, or a task worker's token (signed by the
  # scheduler) fails verification on the api-server ("Invalid auth token")
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
  # POSTGRES_HOST defaults to the postgres service in this compose project.
  # Only the Pi runs Airflow today, and it hosts its own Postgres (local-db
  # profile); pointing this at a remote Postgres also needs clearing
  # airflow-init's `depends_on: postgres`, since a machine without the
  # local-db profile never starts that service -- there's no overlay for
  # that anymore (docker-compose.remote-db.yaml, removed as unused).
  # AIRFLOW_DB_NAME gives each machine its own Airflow metadata database, even
  # when they share one Postgres server. Airflow's schedulers are homogeneous --
  # any scheduler sharing a metadata DB can run any DAG in it -- so two machines
  # that are each meant to own a specific DAG must not share one. They still
  # share the greek_cc application database below, which is what actually
  # coordinates them.
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${AIRFLOW_DB_NAME:-airflow}
  # LocalExecutor runs a project's CPU-bound work as a subprocess of this
  # scheduler container; on a small host that starves the scheduler's own
  # heartbeat past the 30s default, which makes it conclude it died and
  # defensively reset the still-running task as "orphaned" -- throwing away
  # that task's progress and restarting it, not because anything was wrong.
  # Raised well past the heartbeat gaps observed in practice (up to ~77s).
  AIRFLOW__SCHEDULER__SCHEDULER_HEALTH_CHECK_THRESHOLD: "300"
  # A second, separate starvation path: in Airflow 3 each running task has its
  # own supervisor subprocess that heartbeats to the *API server* (not
  # Postgres) to prove that task is alive -- unrelated to the scheduler
  # heartbeat above, and not covered by raising it. The same CPU-bound,
  # single-threaded extraction work (tasks=1 in extract.py) starved this
  # heartbeat too: chunk 0 of CC-MAIN-2024-22 hit 3 failed heartbeats after a
  # burst of slow lxml/Trafilatura parses and was SIGKILLed mid-chunk with no
  # traceback, wasting ~14 minutes of real work for a task that wasn't stuck.
  # Scaled to the same 300s tolerance as the scheduler threshold above, since
  # that value is already proven against this pipeline's worst-case stalls.
  AIRFLOW__WORKERS__MIN_HEARTBEAT_INTERVAL: "5"
  AIRFLOW__WORKERS__MAX_FAILED_HEARTBEATS: "60"

  AIRFLOW_CONN_GREEK_CC_DB: postgresql://greek_cc_app:${GREEK_CC_DB_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/greek_cc
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
  # optional -- HF Hub publish steps in index.py/extract.py warn and no-op when
  # these are unset, so an empty default here is fine on a machine that hasn't
  # configured them
  HF_TOKEN: ${HF_TOKEN:-}
  HF_MANIFEST_REPO: ${HF_MANIFEST_REPO:-}
  HF_DATASET_REPO: ${HF_DATASET_REPO:-}

x-airflow-common: &airflow-common
  # only airflow-init declares `build` — sharing it across every service makes
  # compose build the same tag concurrently and the targets collide
  image: greek-cc-airflow:3.3.1
  user: "${AIRFLOW_UID}:0"
  # Without this the whole stack stays down after a reboot or a dockerd restart,
  # silently halting the crawl until someone notices and runs `up -d` by hand.
  # "unless-stopped" (not "always") so a deliberate `docker compose stop` sticks
  # instead of being undone on the next boot. airflow-init overrides this back
  # to "no" -- it's a one-shot, and restarting it would re-run schema init.
  # The daemon restarts containers independently of compose's depends_on
  # ordering, so a service can come up before postgres is healthy; it exits and
  # is retried by this policy until postgres is there.
  restart: unless-stopped
  # Docker's embedded DNS forwards to the host's systemd-resolved stub
  # (127.0.0.53), which timed out under greek-cc's concurrent S3 fetches and
  # took the whole Pi down twice -- dockerd logged hundreds of "failed to query
  # external DNS server" timeouts, made worse by systemd-resolved flushing its
  # cache under memory pressure (forcing yet more lookups). Talking to real
  # upstream resolvers skips that fragile hop.
  dns:
    - 1.1.1.1
    - 8.8.8.8
  volumes:
    - ./dags:/opt/airflow/dags
    - ./manifests:/opt/airflow/manifests
    - ./airflow_logs:/opt/airflow/logs
    - ./airflow_auth:/opt/airflow/auth
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    # Behind a profile so a machine that uses someone else's Postgres simply
    # doesn't start one. Enabled via COMPOSE_PROFILES=local-db in .env, which
    # keeps `docker compose up -d` identical on every machine.
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
      GREEK_CC_DB_PASSWORD: ${GREEK_CC_DB_PASSWORD}
    # exposed so a GUI client (DBeaver) can reach it from another machine
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    # postgres holds all crawl state; it has to come back on boot for the same
    # reason as the airflow services above (it isn't covered by their anchor)
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      <<: *airflow-env
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
    # keep the image's own entrypoint: it registers an /etc/passwd entry for our
    # host UID, without which airflow's getuser() call blows up
    command:
      - bash
      - -c
      - |
        airflow db migrate
        python -c "
        import json, os
        path = os.environ['AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE']
        json.dump({os.environ['_AIRFLOW_WWW_USER_USERNAME']: os.environ['_AIRFLOW_WWW_USER_PASSWORD']}, open(path, 'w'))
        print('seeded', path)
        "
        python -c "
        from airflow.providers.postgres.hooks.postgres import PostgresHook
        from greek_cc import db
        db.ensure_schema(PostgresHook(postgres_conn_id='greek_cc_db').get_conn())
        "
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    environment: *airflow-env
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    environment: *airflow-env
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    environment: *airflow-env
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
    # Pinned explicitly rather than left to Compose, which derives volume names
    # from the project name (the directory basename). A rename of this directory
    # would otherwise make Compose look for a volume that doesn't exist and
    # silently start from an empty database -- losing every crawl/extract status
    # row and all DAG history. Do not change this name.
    name: greek-cc_postgres-db-volume
