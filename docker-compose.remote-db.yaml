# Overlay for machines that use a Postgres running somewhere else (e.g. the Mac
# doing extraction against the Pi's database). Activate it from .env rather than
# passing -f every time, so the commands stay identical on every machine:
#
#   COMPOSE_FILE=docker-compose.yaml:docker-compose.remote-db.yaml
#   POSTGRES_HOST=192.168.1.x
#
# Leave COMPOSE_PROFILES unset here; the local postgres service stays inactive.
#
# Only airflow-init depends on postgres (the other services depend on
# airflow-init), so this is the single dependency that needs clearing. Without
# it Compose refuses the whole project: a depends_on pointing at a service whose
# profile is inactive is an error, not a no-op.
services:
  airflow-init:
    depends_on: !reset []
